[project]
name = "sortify"
version = "1.0.0"
description = "Organize, move and clean files on your own disk from the console or a local web app."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
sortify = "sortify.__main__:main"

[tool.setuptools.packages.find]
include = ["sortify*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
